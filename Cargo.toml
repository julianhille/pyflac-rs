# SPDX-License-Identifier: 0BSD
[package]
name = "pyflac-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "0BSD"
description = "Python bindings for libflac-rs that release the GIL while encoding and decoding"
repository = "https://github.com/julianhille/pyflac-rs"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
libflac-rs = "=0.143.1"
pyo3 = { version = "0.30.1", features = ["abi3-py311", "extension-module"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
